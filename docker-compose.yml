services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: honeypot-clickhouse
    ports:
    - "8123:8123" # HTTP Port
    - "9000:9000" # Native Port 
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=123456
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  vfs:
    build:
      context: .
      dockerfile: Dockerfile.vfs
    container_name: honeypot_vfs
    ports:
      - "5000:5000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    container_name: honeypot_gateway
    ports:
      - "2222:2222"
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml
      # Go kodunun Docker konteynerleri yaratabilmesi için Docker Socket'i bağlıyoruz:
      - /var/run/docker.sock:/var/run/docker.sock
      # Fallback logları Windows masaüstüne düşsün diye volume bağlıyoruz:
      - ./logs:/app/logs
    depends_on:
      clickhouse:
        condition: service_healthy
      vfs:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  ebpf-agent:
    build:
      context: .
      dockerfile: Dockerfile.ebpf
    container_name: honeypot_ebpf
    privileged: true
    pid:  "host" # Sistemdeki sahte Ubuntu dahil tüm konteynerleri dinlemesi için Host PID izni
    environment:
      - RUST_LOG=info
    volumes:
    - /sys/kernel/debug:/sys/kernel/debug:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  clickhouse_data:
