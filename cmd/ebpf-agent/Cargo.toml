[package]
name = "ebpf-agent"
version = "0.1.0"
edition = "2026"
authors = ["HuseyinOzlu"]
description = "High-interaction kernel telemetry agent using eBPF hooks for Firecracker MicroVMs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
