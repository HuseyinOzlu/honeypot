[package]
name = "ebpf-agent"
version = "0.1.0"
edition = "2024"
authors = ["HuseyinOzlu"]
description = "High-interaction kernel telemetry agent using eBPF hooks for Firecracker MicroVMs"

[dependencies]
tokio = { version = "1", features = ["full", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
aya = "0.11"
bytes = "1"
libc = "0.2"
